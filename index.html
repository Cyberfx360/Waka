<style>
/* VOICE: a helpful conductor: short, local, exact.
   IDEA: road black + ride yellow, danfo stripe; vehicle chips wear each city's livery.
   PICTURE: the live map with the chosen trip drawn thick; step-by-step ride tickets.
   COLOUR and TYPE: #121511 ink, #FFC20E action, #0B7A4B go; Barlow Semi Condensed 800 + Inter.
   LAYOUT: phone: map on top, sheet below, bottom nav. Desktop: panel left, map right. */


.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}

.leaflet-tile::selection {
	background: transparent;
}

.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}

.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;

	}
.leaflet-marker-icon,

	}


.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}

.leaflet-container .leaflet-shadow-pane img,

	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}

.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }

.leaflet-map-pane canvas { z-index: 100; }

.leaflet-vml-shape {
	width: 1px;

	}
.lvml {
	
	display: inline-block;
	position: absolute;
	}




.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; 
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}




.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}




.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {

	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {

	}
.leaflet-popup-pane,
.leaflet-control {

	cursor: move;

:root{--ink:#121511;--bg:#fff;--surface:#F3F4EF;--line:#E2E4DC;--mute:#5B6157;--yel:#FFC20E;--green:#0B7A4B;--go:#3DDC84;--pin:#FF5A5F;--dark2:#23271F;--dark3:#3A3F35;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid #1D4ED8;outline-offset:2px}
.hd{font-family:"Barlow Semi Condensed",Inter,sans-serif;font-weight:800;line-height:1.02;letter-spacing:-.3px}
.mute{color:var(--mute)}.small{font-size:13px}.tiny{font-size:12px}
.stripe{height:6px;background:repeating-linear-gradient(90deg,var(--yel) 0 22px,var(--ink) 22px 30px)}
body[data-city=delta] .stripe{background:repeating-linear-gradient(90deg,#1F5FC9 0 22px,#fff 22px 30px);border-bottom:1px solid #1F5FC9}

/* shell */
.top{display:flex;align-items:center;gap:12px;padding:12px max(16px,3vw);background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:20}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.logo b{font-family:"Barlow Semi Condensed",sans-serif;font-weight:800;font-size:28px;letter-spacing:-.5px}
.citybtn{height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.dnav{margin-left:auto;display:none;gap:22px;font-weight:600;font-size:15px}
.dnav a{text-decoration:none;color:var(--mute);padding:6px 0;border-bottom:3px solid transparent}
.dnav a.on{color:var(--ink);border-color:var(--yel)}
.main{display:flex;flex-direction:column}
#panel{padding:16px 16px calc(96px + var(--safe-b));display:flex;flex-direction:column;gap:14px}
#mapbox{position:relative;display:none;height:38vh;min-height:240px;background:#EEF1EA;order:-1}
#map{position:absolute;inset:0}
body[data-screen=plan] #mapbox{display:block;height:30vh}
body[data-screen=routes] #mapbox{display:block;height:34vh}
body[data-screen=trip] #mapbox{display:block;height:26vh}
body[data-screen=live] #mapbox{display:block;height:46vh}
body[data-screen=add] #mapbox{display:block;height:42vh}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 0 calc(8px + var(--safe-b))}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;color:var(--mute);text-decoration:none;min-height:52px;justify-content:center}
.bnav a .ic{height:30px;width:56px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.bnav a.on{color:var(--ink);font-weight:700}.bnav a.on .ic{background:var(--yel)}
@media(max-width:899px){.legend{display:none!important}}
@media(min-width:900px){.toast.toast{top:auto;bottom:24px}#aiForm#aiForm{bottom:0}}
@media(min-width:900px){
  .dnav{display:flex}.bnav{display:none}
  .main{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);height:calc(100vh - 65px)}
  #panel{overflow:auto;border-right:1px solid var(--line);padding:22px 22px 32px}
  #mapbox,body[data-screen] #mapbox{display:block!important;height:auto!important;min-height:0;order:0}
}

/* components */
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick .btn{min-height:44px;font-size:13.5px;line-height:1.15;padding:4px 6px;text-align:center}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none;min-height:38px;font-size:13.5px;padding:0 13px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border-radius:18px;padding:14px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-decoration:none;color:var(--ink);background:var(--surface)}
.tile .ti{font-size:22px;line-height:1;font-weight:800}
.tile b{font-size:15px;display:block;line-height:1.2}
.tile .s{font-size:12.5px;color:var(--mute);line-height:1.3;display:block;margin-top:3px}
.slim{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);text-decoration:none;color:var(--ink);font-size:14px}
.recent{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;box-sizing:border-box}
.recent b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent .small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(min-width:900px){.hscroll{margin:0;padding:0;flex-wrap:wrap}}
.card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px}
.dark{background:var(--ink);color:#fff;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.field{position:relative;display:flex;align-items:center;gap:12px;background:var(--dark2);border-radius:14px;min-height:54px;padding:0 14px}
.field .lab{font-size:12px;color:#A9AFA3;display:block}
.field input{border:0;background:none;color:#fff;font-weight:600;font-size:16px;padding:0;outline:none;width:100%}
.dotg{width:12px;height:12px;border-radius:50%;background:var(--go);box-shadow:0 0 0 4px rgba(61,220,132,.2);flex:none}
.swap{position:absolute;right:10px;top:38px;width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:var(--yel);display:flex;align-items:center;justify-content:center;z-index:2}
.btn{border:0;border-radius:14px;min-height:50px;padding:0 18px;font-weight:700;font-size:16px;background:var(--yel);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.blk{background:var(--ink);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--line);font-weight:600}
.btn.ghostd{background:none;border:1.5px solid var(--dark3);color:#fff;font-weight:500;font-size:14px;min-height:42px;border-radius:12px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.chip{min-height:40px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;color:var(--mute)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .d{width:10px;height:10px;border-radius:50%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:var(--surface);border-radius:12px;padding:4px}
.seg button{flex:1;min-height:38px;border-radius:9px;border:0;background:none;font-weight:600;font-size:13px;color:var(--mute)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(18,21,17,.15)}
.badge{font:800 11px Inter,sans-serif;letter-spacing:.3px;padding:4px 8px;border-radius:6px;white-space:nowrap;display:inline-block}
.badge.walk{font-weight:600;border:1.5px dashed #9AA093;color:var(--mute);padding:3px 7px}
.flag{font:800 11px Inter,sans-serif;padding:3px 7px;border-radius:6px;background:var(--ink);color:var(--yel)}
.opt{border:1.5px solid var(--line);border-radius:18px;padding:14px;background:#fff;text-align:left;width:100%;display:flex;flex-direction:column;gap:8px}
.opt.sel{border:2px solid var(--ink);box-shadow:0 6px 18px rgba(18,21,17,.10)}
.big{font-family:"Barlow Semi Condensed",sans-serif;font-weight:800;font-size:30px;line-height:1}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:60;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:300px;overflow:auto;display:none}
.sug button{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:10px 14px;min-height:48px}
.sug button.on,.sug button:hover{background:#FFF4CC}
.sug small{color:var(--mute);font-size:12px}
.steps{list-style:none;margin:0;padding:0}
.steps>li{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:10px}
.rail{display:flex;flex-direction:column;align-items:center}
.rail .ln{flex:1;width:4px;border-radius:2px}
.rail .dt{flex:1;width:0;border-left:3px dotted var(--mute)}
.walklist{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px;color:var(--ink)}
.walklist li{display:flex;justify-content:space-between;gap:8px}.walklist li.on{font-weight:700;background:#FFF4CC;border-radius:6px;padding:2px 4px;margin-left:-4px}.walklist li.past{color:var(--mute)}
.stoplist ol{list-style:none;margin:8px 0 0;padding:0 0 0 4px}
.stoplist li{position:relative;padding:3px 0 3px 22px;display:flex;gap:8px;align-items:baseline;justify-content:space-between;font-size:14px}
.stoplist li::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:3px;background:var(--lc)}
.stoplist li::after{content:"";position:absolute;left:2px;top:9px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--lc)}
.stoplist li.b::before{top:12px}.stoplist li.d::before{bottom:calc(100% - 12px)}
.stoplist li.b::after,.stoplist li.d::after{background:var(--lc);width:11px;height:11px;left:1px;top:8px}
.stoplist li.d span:first-child{font-weight:700}
.ticket{background:#fff;border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 1px 0 var(--line);border:1px solid var(--line)}
.call{margin-top:10px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px}
.call .hd{font-size:28px;color:var(--yel)}
.pill{background:var(--surface);border-radius:10px;padding:6px 10px;font-size:14px;white-space:nowrap}
.sheetbar{position:sticky;bottom:calc(72px + var(--safe-b));background:#fff;padding:10px 0 0;display:flex;gap:10px}
@media(min-width:900px){.sheetbar{bottom:0;padding-bottom:4px}}
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:3000;max-width:calc(100% - 32px);display:none}
.mapctl{position:absolute;z-index:500;display:flex;gap:8px}
.mapctl .seg{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);border-radius:999px}
.mapctl .seg button{border-radius:999px;padding:0 14px;font-weight:700}
.mapctl .seg button[aria-pressed=true]{background:var(--ink);color:var(--yel)}
.roundb{width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.taphint{left:50%;bottom:10px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;display:none;white-space:nowrap;pointer-events:none}
body[data-screen=plan] .taphint{display:block}
.cross{position:absolute;left:50%;top:50%;z-index:450;transform:translate(-50%,-100%);display:none;pointer-events:none}
body[data-screen=add] .cross{display:block}
.legend{left:10px;bottom:10px;background:#fff;border-radius:12px;padding:6px 10px;font-size:12px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.2);flex-wrap:wrap;max-width:calc(100% - 20px)}
.legend i{display:inline-block;width:16px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.fares{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.fares button{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:15px}
.fares button[aria-pressed=true]{background:var(--ink);color:var(--yel);border-color:var(--ink)}
.inp{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:#fff}
.inp:focus{border-color:var(--ink);outline:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);position:relative}
.bars{display:flex;align-items:flex-end;gap:3px;height:34px}
.bars span{flex:1;border-radius:3px 3px 0 0;background:#C9CCC2}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.meter>span{display:block;height:100%;border-radius:5px;background:var(--ink)}
.conf{font-weight:700;font-size:12px;padding:3px 8px;border-radius:999px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2500;display:none;align-items:flex-end;justify-content:center}
.dlg.open{display:flex}
.dlg .in{background:#fff;width:min(520px,100%);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + var(--safe-b));max-height:85vh;overflow:auto}
@media(min-width:600px){.dlg{align-items:center}.dlg .in{border-radius:22px}}
.empty{color:var(--mute);font-size:15px;padding:6px 0}
.leaflet-container{font:inherit}
.leaflet-control-attribution.leaflet-control{font-size:10px;line-height:1.4;background:rgba(255,255,255,.72);color:#5B6157;border-radius:8px 0 0 0;padding:1px 6px;margin:0}
.leaflet-control-attribution a{color:#5B6157;text-decoration:none}
.stopdot{border-radius:50%}
</style>
</head>

after.plan=()=>{ wireAC($("#fromIn"),p=>{S.from=p; $("#fromIn").value=p.name; saveLast(); S.fit=true; render();}); wireAC($("#toIn"),p=>{S.to=p; $("#toIn").value=p.name; saveLast(); S.fit=true; render();}); };
const saveLast=()=>store.set("waka.last",{from:S.from,to:S.to});

function legBadges(o){ return o.legs.map((l,k)=>(l.type==="walk"?`<span class="badge walk">${Math.max(1,Math.round(l.min))} min walk</span>`:badge(chipFor(l.r)))+(k<o.legs.length-1?'<span aria-hidden="true" style="color:#9AA093">›</span>':"")).join(" "); }
function routesView(){
  const o=S.opts;

  </div>`).join("")}
  ${o.some(x=>x.wide)?`<div class="card small" style="background:#FFF4CC;border:0">Waka doesn't know many stops near here yet, so this uses a longer walk, keke or okada ride. Add the stops you know with <b>Add stop</b> and routes here get better.</div>`:""}
  <p class="tiny mute" style="margin:0">${settings.city==="delta"?"Delta fares are estimates until riders report them. Okada is banned in Asaba, Oshimili, Ika, Sapele and Uvwie.":"Danfo fares are estimates until riders report them · BRT and bus fares: LAMATA list, 2 Mar 2026."}</p>`;
}
function stepsHtml(o, compact){
  let h=`<ol class="steps">`;
  h+=`<li><div class="rail"><span style="width:16px;height:16px;border-radius:50%;background:var(--go);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--ink)"></span><span class="ln" style="background:${o.legs[0].type==="ride"?lineColor(o.legs[0].r):"transparent"}"></span></div><div style="padding-bottom:12px"><b>Start at ${esc(S.from.name)}</b></div></li>`;
  o.legs.forEach((l,k)=>{
    if(l.type==="walk"){ h+=`<li><div class="rail"><span class="dt"></span></div><div style="padding:0 0 14px;display:flex;align-items:center;gap:10px"><span style="width:36px;height:36px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none">${ICON.walk}</span><span><b>Walk ${Math.max(1,Math.round(l.min))} min</b><span class="small mute" style="display:block">${Math.round(l.m)} m to ${esc(nameOf(l.to))}${k===0&&o.legs[1]?" · the nearest place to catch your ride":""}</span></span></div></li>
      <li><div class="rail"></div><div style="padding:0 0 12px 46px">${walkDetails(nodePt(l.from),nodePt(l.to),nameOf(l.to),(k===0||k===o.legs.length-1)&&!compact,false)}</div></li>`; return; }
    const c=chipFor(l.r), sh=shout(l), from=nodePt(l.from);
    h+=`<li><div class="rail"><span class="ln" style="background:${lineColor(l.r)}"></span></div><div class="ticket">
      <div class="row">${badge(c)}<span class="small mute">wait ~${Math.round(l.wait)} min</span>
        <a class="small" href="${sv(from)}" target="_blank" rel="noopener" style="margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-weight:600">${ICON.eye}Look around</a></div>
      <div style="font-weight:700;font-size:16px;margin-top:8px">Board at ${esc(nameOf(l.from))}</div>
      ${l.r.mode==="coach"?`<div class="small" style="margin-top:6px;background:#FFF1F2;border-radius:10px;padding:8px 10px"><b>Interstate:</b> buy your ticket at the company office inside the park. Most buses leave early in the morning, so book a day before. Fares are from company price lists; confirm at the park.</div>${opsHtml(l.r,!!compact)}`:""}
      ${(()=>{ const h=sideHint(o,k), st=stops[l.from], tip=st&&st.tip; let x="";
        if(h) x+=`<div class="small" style="display:flex;gap:6px;align-items:flex-start;margin-top:6px;${h.cross?"background:#FFF4CC;border-radius:10px;padding:8px 10px;font-weight:600":"color:var(--mute)"}"><span aria-hidden="true">${h.cross?"⇄":"↑"}</span><span>${esc(h.text)}</span></div>`;
        if(tip) x+=`<div class="small" style="margin-top:6px;background:var(--surface);border-radius:10px;padding:8px 10px"><b>Rider tip:</b> ${esc(tip)}</div>`;
        const est=(stops[l.from]&&stops[l.from].estate)||(stops[l.to]&&stops[l.to].estate); if(est&&HOP[l.r.mode]) x+=`<div class="small mute" style="margin-top:6px">Estate ride: works inside ${esc(est)} only.</div>`;
        return x; })()}
      ${HOP[l.r.mode]?`<div class="hd" style="font-size:22px;margin-top:4px">${HOP[l.r.mode].r.name} to ${esc(nameOf(l.to))}</div><div class="small mute">${HOP[l.r.mode].tip}</div>${l.from==="O"&&l.km>4?`<div class="small" style="margin-top:6px;font-weight:600">From your town: at the junction or market, ask for a ${l.r.mode==="okada"?"bike":"keke"} going to ${esc(nameOf(l.to))}.</div>`:""}`:sh?`<div class="call"><div class="tiny" style="color:#C4C9BE">Listen for the conductor</div><div class="hd">“${esc(sh)}”</div></div>`:`<div class="hd" style="font-size:22px;margin-top:4px">${esc(l.r.name)}</div><div class="small mute">Board the one heading to ${esc(toward(l))}</div>`}
      <div class="row" style="margin-top:10px"><span class="pill"><b>${l.stopsN}</b> stop${l.stopsN>1?"s":""}</span><span class="pill">~<b>${Math.round(l.ride)}</b> min</span><span class="pill" style="${l.r.fareSrc==="estimate"?"background:#FFF4CC":""}"><b>${naira(l.fare)}</b> · ${l.r.fareSrc==="estimate"?"estimate":l.r.mode==="coach"?"ticket":"official"}</span></div>
      ${l.seq.length>2?`<details class="stoplist" ${compact?"":"open"}><summary class="small" style="font-weight:600;margin-top:10px;cursor:pointer">Every stop on this ride (${l.seq.length})</summary><ol>${l.seq.map((id,q)=>{ const last=q===l.seq.length-1, first=q===0, ready=q===l.seq.length-2&&!first;
        return `<li class="${first?"b":last?"d":""}" style="--lc:${lineColor(l.r)}"><span>${esc(nodePt(id).name)}</span>${first?'<span class="tiny mute">board</span>':last?'<span class="tiny" style="font-weight:700">drop here</span>':ready?'<span class="tiny" style="color:#B45309;font-weight:600">get ready</span>':""}</li>`; }).join("")}</ol></details>`:""}
      ${VIRT[l.to]&&!HOP[l.r.mode]?`<div class="small" style="margin-top:8px;background:#ECFDF5;border-radius:10px;padding:8px 10px"><b>Roadside drop:</b> this ${modeWord(l.r.mode)} passes near where you're going. Tell the ${l.r.mode==="coach"?"driver":"conductor"} early: “I go drop for ${esc(VIRT[l.to].near||"the road")}”.</div>`:""}
      ${VIRT[l.from]&&!HOP[l.r.mode]?`<div class="small" style="margin-top:8px;background:#ECFDF5;border-radius:10px;padding:8px 10px"><b>Flag it down:</b> stand by the road and wave down a ${modeWord(l.r.mode)} going to ${esc(nameOf(l.seq[l.seq.length-1]))}.</div>`:""}
      <div style="font-weight:700;margin-top:8px">Drop at ${esc(nameOf(l.to))}${l.seq.length>2?`<span class="small mute" style="font-weight:400"> · the stop after ${esc(nodePt(l.seq[l.seq.length-2]).name)}</span>`:""}${l.r.mode==="danfo"?' · shout “O wa!”':""}</div>
      ${(()=>{ const c=changeHint(o,k); return c&&o.legs[k+1]?`<div class="small" style="margin-top:8px;display:flex;gap:6px;align-items:flex-start;border-radius:10px;padding:8px 10px;${c.cross?"background:#FFF4CC;font-weight:600":"background:var(--surface)"}"><span aria-hidden="true">${c.cross?"⇄":"↓"}</span><span>${esc(c.text)}</span></div>`:""; })()}
    </div></li>`;
  });
  return h+`<li><div style="display:flex;justify-content:center">${ICON.pin}</div><div><b>Arrive at ${esc(S.to.name)}</b>${S.to.full&&S.to.full!==S.to.name?`<div class="small">${esc(S.to.full)}</div>`:""}<div class="small mute">About ${clock(o.min)}</div></div></li></ol>`;
}
function tripView(){
  const o=S.opts[S.sel];
  return `
  <div style="background:var(--ink);color:#fff;border-radius:20px;padding:14px 16px 18px;position:relative;overflow:hidden">
    <div class="row" style="flex-wrap:nowrap"><a class="roundb" href="#routes" aria-label="Back to routes" style="background:var(--dark2);color:#fff;box-shadow:none">${ICON.back}</a><span class="small" style="color:#C4C9BE">${esc(S.from.name)} → ${esc(S.to.name)}</span></div>
    <div style="display:flex;align-items:flex-end;gap:14px;margin-top:12px"><span class="hd" style="font-size:44px">${fmtMin(o.min)}</span><span style="padding-bottom:3px"><b style="font-size:20px;color:var(--yel);display:block">${o.boards?naira(o.fare):"Free"}</b><span class="small" style="color:#C4C9BE">${o.boards} ride${o.boards===1?"":"s"} · arrive ${clock(o.min)}</span></span></div>
    <div class="stripe" style="position:absolute;left:0;right:0;bottom:0"></div>
  </div>

}
function liveView(){
  const L=S.live, o=L.o, l=o.legs[L.leg];
  let head, body;
  if(l.type==="walk"){ head=`Walk to ${esc(nameOf(l.to))}`; body=`<div class="small mute">${Math.round(l.m)} m · about ${Math.max(1,Math.round(l.min))} min</div>${walkDetails(nodePt(l.from),nodePt(l.to),nameOf(l.to),true,true)}<button class="btn blk wide" data-act="next">I'm there</button>`; }
  else { const left=l.seq.length-1-L.idx, cur=nodePt(l.seq[L.idx]), dropName=nameOf(l.to);
    head= L.idx===0? `Board at ${esc(cur.name)}` : left===0? `Drop here: ${esc(dropName)}` : `${left} stop${left>1?"s":""} to ${esc(dropName)}`;
    body=`${L.idx===0? (HOP[l.r.mode]?`<div class="hd" style="font-size:22px">${HOP[l.r.mode].r.name} to ${esc(dropName)}</div><div class="small mute">Agree the price first: about ${naira(l.fare)}</div>`:shout(l)?`<div class="call"><div class="tiny" style="color:#C4C9BE">Listen for</div><div class="hd">“${esc(shout(l))}”</div></div>`:`<div class="hd" style="font-size:22px">${esc(l.r.name)}</div>`):""}
      <div><div class="row small mute" style="justify-content:space-between;flex-wrap:nowrap"><span>${esc(nodePt(l.seq[0]).name)}</span><b style="color:var(--ink)">${esc(dropName)}</b></div>
      <div class="meter" role="progressbar" aria-label="Progress on this ride" aria-valuenow="${Math.round(L.idx/(l.seq.length-1)*100)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${Math.round(L.idx/(l.seq.length-1)*100)}%;background:${lineColor(l.r)}"></span></div></div>
      <div class="small">Now at <b>${esc(cur.name)}</b>${L.idx<l.seq.length-1?` · next: ${esc(nodePt(l.seq[L.idx+1]).name)}`:""}</div>
      ${left>1?`<div class="small mute">Still to pass: ${l.seq.slice(L.idx+1,-1).map(id=>esc(nodePt(id).name)).join(" · ")}</div>`:""}
      ${left<=1&&L.idx>0?(()=>{ const c=changeHint(o,L.leg); return c?`<div class="small" style="border-radius:10px;padding:8px 10px;background:${c.cross?"#fff":"rgba(255,255,255,.6)"};font-weight:${c.cross?700:500}">${c.cross?"⇄ ":""}${esc(c.text)}</div>`:""; })():""}
      <button class="btn blk wide" data-act="next">${L.idx===0?"I've boarded":left===0?"I've dropped":"Next stop reached"}</button>`; }
  const nxt=o.legs[L.leg+1];
  const liveLine = L.gps&&L.dist!=null? `<div class="card row" style="flex-wrap:nowrap;gap:10px;border-color:${L.off>=2?"#C8102E":"var(--line)"}"><span style="width:10px;height:10px;border-radius:50%;background:${L.off>=2?"#C8102E":"#16A34A"};box-shadow:0 0 0 4px ${L.off>=2?"#FEE2E2":"#DCFCE7"};flex:none"></span>
    <span class="small" style="flex:1">${L.off>=2?`<b>Off the route?</b> You're about ${metres(offRoute(L.pos,l))} from it. Tap Re-route if you entered the wrong one.`:`<b>Live</b> · ${metres(L.dist)} to ${esc(nameOf(l.to))} · about ${Math.max(1,Math.round(L.eta))} min${L.v>1?` · ${Math.round(L.v*3.6)} km/h`:""}`}</span>${L.acc>80?`<span class="tiny mute">GPS ±${Math.round(L.acc)} m</span>`:""}</div>` : "";
  return `
  <div style="background:${l.type==="ride"&&(l.seq.length-1-L.idx)<=1&&L.idx>0?"var(--yel)":"var(--surface)"};border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px">
    <div class="row">${l.type==="ride"?badge(chipFor(l.r)):'<span class="badge walk">WALK</span>'}<span class="small">Arrive ~${clock(remaining())}</span></div>
    <div class="hd" style="font-size:28px">${head}</div>${body}
  </div>
  ${liveLine}
  ${nxt?`<div class="card row" style="flex-wrap:nowrap"><span class="flag">NEXT</span><span class="small">${nxt.type==="walk"?`Walk ${Math.max(1,Math.round(nxt.min))} min to ${esc(nameOf(nxt.to))}`:`${esc(chipFor(nxt.r).label)} at ${esc(nameOf(nxt.from))}${shout(nxt)?`: “${esc(shout(nxt))}”`:""} · ${naira(nxt.fare)}`}</span></div>`:""}
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
    <button class="btn ghost" data-act="gps">${L.gps?"◉ Live tracking on":"Turn on live tracking"}</button>
    <button class="btn ghost" data-act="alerts">${settings.alerts!==false?"🔔 Stop alerts on":"🔕 Stop alerts off"}</button>
    <button class="btn ghost" data-act="shareLive">Share live trip</button>
    <a class="btn ghost" href="${sv(l.type==="walk"?nodePt(l.to):nodePt(l.seq[Math.min(L.idx+1,l.seq.length-1)]))}" target="_blank" rel="noopener">${ICON.eye}Look around</a>
    <button class="btn ghost" data-act="reroute">Wrong bus? Re-route</button>
    <button class="btn ghost" data-act="voice" aria-pressed="${settings.voice!==false}">${settings.voice===false?"Voice off":"Voice on"}</button>
    <button class="btn ghost" data-act="repeat">Say it again</button>
  </div>
  <button class="btn ghost wide" data-act="endTrip">End trip</button>`;
}
function remaining(){ const L=S.live; let m=0; L.o.legs.forEach((l,k)=>{ if(k>L.leg) m+=l.min; else if(k===L.leg) m+= l.type==="walk"? l.min : l.ride*(1-L.idx/(l.seq.length-1)) + (L.idx===0?l.wait:0); }); return m; }
function fareChoices(f){ const set=[f-100,f-50,f,f+50,f+100].filter(x=>x>=100); return [...new Set(set)].slice(0,4); }

      <button class="btn" data-act="opRateSend" data-r="${c.r.id}">Rate the company</button><span class="tiny mute">Waka marks a company "Riders' best" once 3 or more riders rate it.</span></div>`; })()}

    <textarea class="inp" id="tripNote" rows="2" maxlength="1000" placeholder="Anything to tell Waka? e.g. the motor no stop for Kwale Road"></textarea><button class="btn ghost" data-act="tripNote">Send</button></div>
  ${rides.length?`<div><div class="hd" style="font-size:26px">Quick one: wetin you pay?</div><div class="small mute">One tap per ride. It keeps fares honest for the next person.</div></div>`:""}
  ${rides.map((l,k)=>{ const official=l.r.fareSrc!=="estimate"; const v=D.fares[k];
    return `<div class="card" style="display:flex;flex-direction:column;gap:10px">

    </div>`; }).join("")}
  <div class="card" style="display:flex;flex-direction:column;gap:10px"><b>Did you go the way Waka showed?</b>

/* ================= live trip ================= */
/* spoken trip announcements (Web Speech) */
const spoken = n => String(n||"").replace(/\s*\(.*?\)/g,"").replace(/–/g," to ");
function say(t){ if(settings.voice===false) return; try{ const ss=window.speechSynthesis; if(!ss||!window.SpeechSynthesisUtterance) return; ss.cancel();
  const u=new SpeechSynthesisUtterance(t), vs=ss.getVoices(); u.voice=vs.find(v=>/en[-_]NG/i.test(v.lang))||vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null; u.rate=.95; ss.speak(u); }catch(e){} }
function announce(){ const L=S.live; if(!L) return; const l=L.o.legs[L.leg];
  if(l.type==="walk"){ say(`Walk ${Math.max(1,Math.round(l.min))} minute${Math.round(l.min)>1?"s":""} to ${spoken(nameOf(l.to))}.`); return; }
  const left=l.seq.length-1-L.idx, drop=spoken(nameOf(l.to)), H=HOP[l.r.mode];
  if(L.idx===0){ const sh2=sideHint(L.o,L.leg); const pre=sh2&&sh2.cross?"Cross to the other side of the road. ":"";
    if(pre){ const t0=H? `Take ${l.r.mode==="okada"?"an okada":"a keke"} to ${drop}.` : shout(l)? `Then board, and listen for the conductor shouting: ${shout(l)}` : `Then board the ${spoken(l.r.name)} heading to ${spoken(toward(l))}.`; say(pre+t0); return; }
    say(H? `Take ${l.r.mode==="okada"?"an okada":"a keke"} to ${drop}. Agree the price first. About ${l.fare} naira.` : shout(l)? `Board at ${spoken(nameOf(l.from))}. Listen for the conductor shouting: ${shout(l)}` : `Board the ${spoken(l.r.name)} at ${spoken(nameOf(l.from))}, heading to ${spoken(toward(l))}.`); return; }
  if(left===0){ const c=changeHint(L.o,L.leg); say(`Drop here at ${drop}.${l.r.mode==="danfo"?" Shout, O wa!":""}${c&&L.o.legs[L.leg+1]?" "+c.text.replace(/^Come down at [^.]*\.\s*/,""):""}`); return; }
  if(left===1){ say(`Get ready. Next stop is ${drop}. That is where you drop.`); return; }
  say(`Now at ${spoken(nameOf(l.seq[L.idx]))}. ${left} stops to ${drop}.`); }
function advance(){ const L=S.live, l=L.o.legs[L.leg];
  if(l.type==="ride"&&L.idx<l.seq.length-1){ L.idx++; buzzCheck(); render(); announce(); return; }
  if(L.leg<L.o.legs.length-1){ L.leg++; L.idx=0; render(); announce(); return; }
  finishTrip(true); }
function buzzCheck(){ const L=S.live, l=L.o.legs[L.leg]; if(l.type!=="ride") return; const left=l.seq.length-1-L.idx; if(left===1&&!L.buzzed[L.leg]){ L.buzzed[L.leg]=1; notify("Next stop is yours",`Get ready: ${nameOf(l.to)} is next.`,"waka-next"); } }
function finishTrip(completed){ const L=S.live; stopGps(); keepAwake(false); S.live=null; if(!L){ go("plan"); return; }
  if(completed) say(`You don reach ${spoken(S.to.name)}! Safe trip.`);
  if(completed){ const how=L.o.legs.filter(l=>l.type==="ride").map(l=>l.r.mode).join(" + ")||"walk"; queue("trips",tripRow({from:S.from,to:S.to,how,fare:L.o.fare,min:L.o.min})); }
  const rides=L.o.legs.filter(l=>l.type==="ride"); settings.askN=(settings.askN||0)+1; saveSettings();
  const ask= rides.length && (settings.ask==="Always" || (settings.ask==="Sometimes" && settings.askN%2===1));
  if(ask){ S.done={o:L.o,fares:rides.map(l=>l.r.fareSrc!=="estimate"?l.fare:null),same:true}; go("done"); } else { toast(`You don reach ${S.to.name}!`); go("plan"); } }
let watchId=null;

/* ===== live tracking + stop alerts ===== */
if(settings.alerts===undefined) settings.alerts=true;
async function askNotify(){ if(!("Notification" in window)) return false; if(Notification.permission==="granted") return true; if(Notification.permission==="denied") return false;
  try{ return (await Notification.requestPermission())==="granted"; }catch(e){ return false; } }
function beep(){ try{ const A=window.AudioContext||window.webkitAudioContext; if(!A) return; const c=beep.c=beep.c||new A(); if(c.state==="suspended") c.resume();
  [0,.28].forEach(t=>{ const o=c.createOscillator(), g=c.createGain(); o.frequency.value=880; o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(.0001,c.currentTime+t); g.gain.exponentialRampToValueAtTime(.35,c.currentTime+t+.02); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.22); o.start(c.currentTime+t); o.stop(c.currentTime+t+.25); }); }catch(e){} }
async function notify(title,body,tag){ if(settings.alerts===false) return;
  try{ navigator.vibrate&&navigator.vibrate([400,150,400,150,400]); }catch(e){} beep(); toast(/[?!.]$/.test(title)?`${title} ${body}`:`${title}: ${body}`);
  if(!("Notification" in window)||Notification.permission!=="granted") return;
  try{ const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    if(reg&&reg.showNotification) await reg.showNotification(title,{body,tag,renotify:true,icon:"icon-192.png",badge:"icon-192.png",vibrate:[400,150,400],requireInteraction:true});
    else new Notification(title,{body,tag}); }catch(e){} }
async function keepAwake(on){ try{ if(on&&"wakeLock" in navigator&&!S.wl){ S.wl=await navigator.wakeLock.request("screen"); S.wl.addEventListener("release",()=>{ S.wl=null; }); }
  if(!on&&S.wl){ await S.wl.release(); S.wl=null; } }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&S.live) keepAwake(true); });
/* how far from the route line (metres), for "off route" */
function offRoute(pos,l){ let best=Infinity; for(let q=0;q<l.seq.length-1;q++){ const r=projSeg(pos,nodePt(l.seq[q]),nodePt(l.seq[q+1])); if(r.d<best) best=r.d; } return best; }
function track(pos,acc,spd){ const L=S.live; if(!L) return; const l=L.o.legs[L.leg];
  /* speed: GPS speed when given, else from the last two fixes, smoothed */
  const now=Date.now(); if(L.last){ const dt=(now-L.last.t)/1000; if(dt>2){ const v=hav(L.last,pos)/dt; L.v=L.v? L.v*.6+v*.4 : v; } }
  if(spd!=null&&spd>=0) L.v=L.v? L.v*.5+spd*.5 : spd; L.last={...pos,t:now}; L.acc=acc;
  const tgt = l.type==="walk"? nodePt(l.to) : nodePt(l.to), next = l.type==="ride"&&L.idx<l.seq.length-1? nodePt(l.seq[L.idx+1]) : tgt;
  L.dist=hav(pos,tgt); L.distNext=hav(pos,next);
  const v=L.v&&L.v>1? L.v : (l.type==="walk"? WALK_MPM/60 : (SPEED[l.r.mode]||18)/3.6*(settings.traffic||1)); L.eta=L.dist*1.25/v/60;
  const al=L.alerts=L.alerts||{}, key=L.leg+":";
  if(l.type==="ride"&&(L.idx>0||hav(pos,nodePt(l.from))>400)){   /* you're on board once you've left the stop */
    if(L.dist<700&&L.dist>=250&&!al[key+"near"]){ al[key+"near"]=1; notify("Get ready",`${nameOf(l.to)} is about ${Math.max(1,Math.round(L.eta))} min away. Tell the ${l.r.mode==="coach"?"driver":"conductor"} you go drop.`,"waka-near"); say(`Get ready. ${spoken(nameOf(l.to))} dey near, about ${Math.max(1,Math.round(L.eta))} minutes.`); }
    if(L.dist<250&&!al[key+"here"]){ al[key+"here"]=1; const c=changeHint(L.o,L.leg); notify("Drop here",`${nameOf(l.to)}.${c&&L.o.legs[L.leg+1]?" "+c.text.replace(/^Come down at [^.]*\.\s*/,""):""}`,"waka-drop"); }
    const off=offRoute(pos,l); L.off = off>1500 ? (L.off||0)+1 : 0;
    if(L.off===2) notify("Off the route?",`You seem to be away from the ${modeWord(l.r.mode)} route. Tap Re-route if you entered the wrong one.`,"waka-off"); }
  if(l.type==="walk"&&L.dist<150&&!al[key+"walk"]){ al[key+"walk"]=1; const n=L.o.legs[L.leg+1]; notify("You don reach",n?`${nameOf(l.to)}. Your ${modeWord(n.r.mode)} loads here.`:`${nameOf(l.to)}.`,"waka-walk"); } }
function startGps(){ try{ watchId=navigator.geolocation.watchPosition(p=>{ const L=S.live; if(!L) return; L.gps=true; const pos={lat:p.coords.latitude,lon:p.coords.longitude}; L.pos=pos; track(pos,p.coords.accuracy,p.coords.speed);
    const l=L.o.legs[L.leg]; if(l.type==="ride"){ let best=L.idx,bd=Infinity; l.seq.forEach((s,i)=>{ if(i<L.idx) return; const d=hav(pos,nodePt(s)); if(d<bd){bd=d;best=i;} }); if(bd<350&&best>L.idx){ L.idx=best; buzzCheck(); announce(); } }
    else if(hav(pos,nodePt(l.to))<120){ advance(); return; }
    else if(L.W){ const st=L.W.steps; let k=L.ws||0; for(let i=k;i<st.length;i++) if(hav(pos,st[i].loc)<30) k=i+1; if(k>(L.ws||0)&&k<st.length){ L.ws=k; say(stepWords(st[k],nameOf(l.to))); } }
    render(); }, ()=>{ toast("Couldn't get GPS. Tap the buttons as you go."); }, {enableHighAccuracy:true,maximumAge:5000}); }catch(e){ toast("GPS isn't available here. Tap the buttons as you go."); } }
function stopGps(){ try{ if(watchId!=null) navigator.geolocation.clearWatch(watchId); }catch(e){} watchId=null; }

/* ================= server (Supabase) ================= */
let sb=null, online=false, outbox=store.get("waka.outbox",[]), community=[], serverMsg="Saved on this device only";
const SB_ON = SB.url.startsWith("https://") && SB.key.length>20;
async function initServer(){
  if(!SB_ON||!window.supabase){ return; }

function riderRouteStops(r,tag){ const ids=[]; const base=Object.values(stops).filter(x=>!isUser(x));
  r.stops.forEach((p,k)=>{ if(p.lat==null||p.lon==null) return;
    let id=p.stopId&&stops[p.stopId]&&!isUser(stops[p.stopId])?p.stopId:null;
    if(!id){ let best=null,bd=150; base.forEach(x=>{ const d=hav(p,x); if(d<bd){bd=d;best=x;} }); if(best) id=best.id; }
    if(!id){ id=tag+"_"+k; stops[id]={id,name:p.name,lat:p.lat,lon:p.lon,kind:"user",area:"On a route riders shared",aka:[],kinds:[r.mode],estate:null,gate:false,tip:""}; }
    if(ids[ids.length-1]!==id) ids.push(id); });
  return ids; }

  routes.length=BASE_ROUTES;
  const add=(r,tag,src)=>{ const mode=ROUTE_MODE[r.mode]||r.mode; if(!LIVERY[mode]||mode==="okada"||!Array.isArray(r.stops)) return; const ids=riderRouteStops(r,tag); if(ids.length<2) return;

    routes.push({id:tag,mode,name:r.name,stops:ids,fare,fareSrc:src,city:r.city||settings.city,rider:true}); };
  myRoutes.forEach((r,i)=>add(r,"ru"+i,"you"));

  if(!online||!sb) reply="Waka AI needs internet. Connect and try again. You fit still use Add stop and share your fares.";
  else try{
    const names=[...new Set([...Object.values(stops).filter(x=>!isUser(x)&&(x.city||"lagos")===settings.city).map(x=>x.name),...(settings.city==="delta"?(DATA.places||[]).map(x=>x.name):[])])];
    const msgs=chat.slice(-12).map(m=>({role:m.role,content:(m.content||"")+((m.cards||[]).length?"\n"+m.cards.map(cardText).join("\n"):"")}));
    const {data,error}=await sb.functions.invoke("waka-agent",{body:{city:settings.city,stops:names,here:S.from?.name||"",messages:msgs}});
    if(error){ let j=null; try{ j=await error.context.json(); }catch(e){} reply=(j&&j.reply)||"Waka AI no fit answer now. Try again."; }
    else { reply=String(data&&data.reply||""); cards=(data&&data.proposals||[]).filter(p=>p&&AI_TOOLS.has(p.type)).map(p=>({type:p.type,input:p.input||{}})); }
  }catch(e){ reply="Waka AI no fit answer now. Try again."; }
  chat.push({role:"assistant",content:reply,cards}); if(chat.length>60) chat=chat.slice(-60); S.aiBusy=false; saveChat();
  if(document.body.dataset.screen==="ai") render(); else toast("Waka AI don answer. Open Waka AI to see."); }
Object.assign(ACT,{
  aiStarter(b){ const q=b.dataset.v; if(/ $/.test(q)){ S.aiDraft=q; render(); } else askAI(q); },
  aiClear(){ chat=[]; saveChat(); render(); },
  aiSkip(b){ const c=chat[+b.dataset.i]?.cards?.[+b.dataset.j]; if(!c) return; c.state="no"; saveChat(); render(); },
  aiSave(b){ const c=chat[+b.dataset.i]?.cards?.[+b.dataset.j]; if(!c||c.state) return; const x=c.input||{};
    if(c.type==="propose_route"){
      const pts=(Array.isArray(x.stops)?x.stops:[]).slice(0,30).map(n=>{ const p=placeFor(n); return p?{name:cut(p.name,60),lat:+(+p.lat).toFixed(5),lon:+(+p.lon).toFixed(5),stopId:p.stopId}:{name:cut(n,60)}; });
      if(pts.length<2){ toast("A route needs at least two places."); return; }
      const mode=["danfo","bus","brt","rail","keke","korope","okada","taxi","shuttle","coach"].includes(x.mode)?x.mode:"bus";
      const fare=+x.fare>=50&&+x.fare<=100000?Math.round(+x.fare):null;
      const r={name:cut(x.name||pts.map(p=>p.name).join(" – "),80),mode,stops:pts,fare,note:x.note?cut(x.note,200):null,city:settings.city,at:Date.now()};
      myRoutes.push(r); store.set("waka.routes",myRoutes);
      queue("route_submissions",{city:r.city,name:r.name,mode,stops:pts.map(p=>p.lat!=null?{name:p.name,lat:p.lat,lon:p.lon}:{name:p.name}),fare,note:r.note,via:"agent"});
      syncUserStops(); buildGraph(); drawNet(); S.opts=[];
      toast(pts.filter(p=>p.lat!=null).length>=2?"Saved. Waka uses this route for you now, and for everybody once other riders confirm am.":"Saved and sent. Add the missing stops with Add stop so Waka fit use this route.");
    } else if(c.type==="propose_fare"){
      const a=placeFor(x.from), z=placeFor(x.to), fare=Math.round(+x.fare);
      if(!a||!z){ toast("Waka no know one of those places yet. Add am with Add stop first."); return; }
      if(!(fare>=50&&fare<=50000)){ toast("That fare look wrong."); return; }
      const rep={mode:ROUTE_MODE[x.mode]&&x.mode==="shuttle"?"bus":x.mode,from:a,to:z,fare,shout:"",slot:slotNow(),src:"shared",at:Date.now()};
      reports.push(rep); store.set("waka.reports",reports); queue("fare_reports",reportRow(rep)); toast("Thanks. Your fare helps every rider.");
    } else if(c.type==="propose_stop"){
      S.prefillStop={name:cut(x.name,60),tip:cut(x.tip||(x.near?"Near "+x.near:""),140),kinds:Array.isArray(x.kinds)?x.kinds:[]};
      const near=S.aiLoc||placeFor(x.near)||placeFor(x.name); S.aiLoc=null; c.state="saved"; saveChat(); go("add"); if(map&&near) map.setView([near.lat,near.lon],near===placeFor(x.near)?17:18);
      toast("Move the map so the pin sits on the stop, then tap Save."); return;
    } else if(c.type==="send_feedback"){
      if(!String(x.body||"").trim()) return; { const row={city:settings.city,topic:x.topic?cut(x.topic,40):null,body:cut(x.body,1000),via:"agent"}; opinions.push({...row,at:Date.now()}); store.set("waka.opinions",opinions); queue("feedback",row); } toast("Sent to the Waka team. Thank you!");
    } else if(c.type==="plan_trip"){
      const z=placeFor(x.to), a=x.from?placeFor(x.from):null;
      if(!z){ toast(`Waka no know “${x.to}” yet. Try a nearby park or stop.`); return; }
      if(a) S.from=a; S.to=z; saveLast(); c.state="saved"; saveChat();
      if(!S.from){ go("plan"); toast("Where you dey start from?"); return; } location.hash="plan"; render(); ACT.find(); return;
    }
    c.state="saved"; saveChat(); render(); }
});

/* ================= map ================= */
let map=null, base={}, net, jl, pins;
function initMap(){
  if(!window.L){ $("#map").innerHTML='<p style="padding:16px" class="small mute">The map couldn\'t load (no internet?). Planning still works.</p>'; return; }
  map=L.map("map",{zoomControl:false,preferCanvas:true,attributionControl:false}).setView(curCity().center,curCity().zoom||12);
  map.attributionControl=L.control.attribution({prefix:false,position:"bottomright"}).addTo(map);
  map.attributionControl.addAttribution('Routes: <a href="https://routing.openstreetmap.de" target="_blank" rel="noopener">FOSSGIS</a>');
  base.map=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>'});
  base.sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"© Esri, Maxar"});
  let warned=false; const tileErr=()=>{ if(warned) return; warned=true; const n=document.createElement("div"); n.className="mapctl"; n.style.cssText="pointer-events:none;left:10px;bottom:34px;background:#fff;border-radius:10px;padding:6px 10px;font-size:12px;max-width:calc(100% - 20px);box-shadow:0 2px 10px rgba(0,0,0,.2)"; n.textContent="Map pictures can't load in this view. Open the hosted Waka app for the full street and satellite map."; $("#mapbox").appendChild(n); };
  base.map.on("tileerror",tileErr); base.sat.on("tileerror",tileErr);
  net=L.layerGroup().addTo(map); jl=L.layerGroup().addTo(map); pins=L.layerGroup().addTo(map);
  setLayer();
  map.on("zoomend",netVis);
  map.on("click",e=>{ if(document.body.dataset.screen==="add"||(document.body.dataset.screen!=="plan"&&innerWidth<900)) return; const p={name:nearName({lat:e.latlng.lat,lon:e.latlng.lng},"Pin"),lat:e.latlng.lat,lon:e.latlng.lng};
    L.popup().setLatLng(e.latlng).setContent(`<div style="display:flex;flex-direction:column;gap:6px"><b>${esc(p.name)}</b><div style="display:flex;gap:6px"><button class="btn ghost" style="min-height:40px;font-size:14px;padding:0 12px" data-act="pinFrom">Start here</button><button class="btn" style="min-height:40px;font-size:14px;padding:0 12px" data-act="pinTo">Go here</button></div><a class="small" href="${sv(p)}" target="_blank" rel="noopener">Look around (Street View)</a></div>`).openOn(map); ACT._pin=p; });
  ACT.pinFrom=()=>{ S.from=ACT._pin; saveLast(); map.closePopup(); if(location.hash!=="#plan") location.hash="plan"; else render(); toast("Start set. Now tap where you dey go."); };
  ACT.pinTo=()=>{ S.to=ACT._pin; saveLast(); map.closePopup(); if(!S.from){ toast("Destination set. Choose where you're starting."); go("plan"); return; } location.hash="plan"; render(); ACT.find(); };
  drawLegend();
}
function setLayer(){ if(!map) return; const v=settings.layer==="sat"?"sat":"map"; Object.entries(base).forEach(([k,l])=>{ if(k===v) l.addTo(map); else map.removeLayer(l); });
  document.querySelectorAll('[data-act=layer]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v)); drawNet(); drawMap(document.body.dataset.screen); }
function drawNet(){ if(!map) return; net.clearLayers(); const sat=settings.layer==="sat";
  Object.values(stops).forEach(s=>{ if(isUser(s)) return; const m=L.circleMarker([s.lat,s.lon],{radius:s.kind==="hub"?5:3.5,color:"#121511",weight:1.5,fillColor:s.kind==="hub"?"#FFC20E":"#fff",fillOpacity:1}).addTo(net);
    m.bindPopup(()=>{ const rs=servedBy[s.id]||[]; ACT._pin={name:s.name,lat:s.lat,lon:s.lon,stopId:s.id}; return `<div style="display:flex;flex-direction:column;gap:6px;max-width:220px"><b>${esc(s.name)}</b><span class="tiny mute">${rs.slice(0,4).map(r=>esc(r.name)).join(" · ")}</span><div style="display:flex;gap:6px"><button class="btn ghost" style="min-height:36px;font-size:13px;padding:0 10px" data-act="pinFrom">Start here</button><button class="btn" style="min-height:36px;font-size:13px;padding:0 10px" data-act="pinTo">Go here</button></div><a class="small" href="${sv(s)}" target="_blank" rel="noopener">Look around (Street View)</a></div>`; }); });
  community.forEach(s=>L.circleMarker([s.lat,s.lon],{radius:4,color:"#DB2777",weight:2,fillColor:"#FCE7F3",fillOpacity:1}).bindTooltip(esc(s.name)+" · added by riders").addTo(net));
  mine.forEach(s=>L.circleMarker([s.lat,s.lon],{radius:5,color:"#DB2777",weight:2,fillColor:"#fff",fillOpacity:1}).bindTooltip(esc(s.name)).addTo(net));
}
/* road-following lines (OpenStreetMap routing via FOSSGIS OSRM) */
const ROUTER={car:"https://routing.openstreetmap.de/routed-car/route/v1/driving/",foot:"https://routing.openstreetmap.de/routed-foot/route/v1/driving/"};
let geoCache=store.get("waka.geo",{}), geoOrder=store.get("waka.geoOrder",[]), drawToken=0;
async function roadLine(pts,profile){
  const key=profile+":"+pts.map(p=>p[0].toFixed(5)+","+p[1].toFixed(5)).join(";");
  if(geoCache[key]) return geoCache[key];
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),9000);
  try{ const r=await fetch(ROUTER[profile]+pts.map(p=>p[1].toFixed(6)+","+p[0].toFixed(6)).join(";")+"?overview=full&geometries=geojson",{signal:ctl.signal});
    if(!r.ok) return null; const j=await r.json(); const c=j.routes&&j.routes[0]&&j.routes[0].geometry&&j.routes[0].geometry.coordinates; if(!c||c.length<2) return null;
    const step=Math.max(1,Math.floor(c.length/400)); const line=c.filter((_,i)=>i%step===0||i===c.length-1).map(q=>[+q[1].toFixed(5),+q[0].toFixed(5)]);
    geoCache[key]=line; geoOrder.push(key); while(geoOrder.length>60){ delete geoCache[geoOrder.shift()]; }
    store.set("waka.geo",geoCache); store.set("waka.geoOrder",geoOrder); return line;
  }catch(e){ return null; } finally{ clearTimeout(t); } }
function snapLeg(polys,pts,profile,tok,styles){ if(pts.length<2) return; roadLine(pts,profile).then(line=>{ if(!line||tok!==drawToken) return; polys.forEach((pl,i)=>{ pl.setLatLngs(line); if(styles&&styles[i]) pl.setStyle(styles[i]); }); }); }

/* stop dots only when zoomed in close and no trip is on screen: the map shows where you are going, nothing else */
function netVis(){ if(!map) return; const show=!S.mapJourney&&map.getZoom()>=14; if(show&&!map.hasLayer(net)) net.addTo(map); if(!show&&map.hasLayer(net)) map.removeLayer(net); }
function drawMap(screen){
  if(!map) return; setTimeout(()=>map.invalidateSize(),60);
  jl.clearLayers(); pins.clearLayers(); const tok=++drawToken;
  const pin=(p,c,t)=>p&&L.circleMarker([p.lat,p.lon],{radius:9,color:"#fff",weight:3,fillColor:c,fillOpacity:1}).bindTooltip(t).addTo(pins);
  let o=null; if(screen==="routes"||screen==="trip") o=S.opts[S.sel]; if(screen==="live"&&S.live) o=S.live.o;
  S.mapJourney=!!o; netVis();
  { const lg=$("#legend"); if(lg){ const ms=o?[...new Set(o.legs.filter(l=>l.type==="ride").map(l=>l.r))]:[]; lg.style.display=ms.length?"":"none";
      if(ms.length) lg.innerHTML=[...new Map(ms.map(r=>[lineColor(r),[lineColor(r),chipFor(r).label]])).values()].map(([c,t])=>`<span><i style="background:${c}"></i>${esc(t)}</span>`).join(""); } }
  if(o){ const all=[];
    o.legs.forEach((l,k)=>{ if(l.type==="walk"){ const pts=[nodePt(l.from),nodePt(l.to)].map(p=>[p.lat,p.lon]); const w=L.polyline(pts,{color:settings.layer==="sat"?"#fff":"#555",weight:4,dashArray:"2 8",lineCap:"round"}).addTo(jl); all.push(...pts); snapLeg([w],pts,"foot",tok); }
      else { const pts=l.seq.map(s=>{ const q=nodePt(s); return [q.lat,q.lon]; }); /* until the real road loads, only a faint dotted hint, never a solid straight line */
        const a=L.polyline(pts,{color:"#121511",weight:0,opacity:0}).addTo(jl), b=L.polyline(pts,{color:lineColor(l.r),weight:4,opacity:.45,dashArray:"1 9",lineCap:"round"}).addTo(jl);
        const solid=[{weight:10,opacity:.9},{weight:6,opacity:1,dashArray:null}]; if(l.r.mode!=="rail") snapLeg([a,b],pts,"car",tok,solid); else { a.setStyle(solid[0]); b.setStyle(solid[1]); }
        [l.from,l.to].forEach(s=>{ const p=nodePt(s); L.circleMarker([p.lat,p.lon],{radius:7,color:"#121511",weight:3,fillColor:"#fff",fillOpacity:1}).addTo(jl); }); all.push(...pts); } });
    pin(S.from,"#3DDC84","Start"); pin(S.to,"#FF5A5F","Destination");
    if(screen==="live"){ const L2=S.live, l=o.legs[L2.leg]; const here=L2.pos|| (l.type==="walk"? nodePt(l.from) : nodePt(l.seq[L2.idx]));
      L.circleMarker([here.lat,here.lon],{radius:16,color:"#3D7BFF",weight:0,fillColor:"#3D7BFF",fillOpacity:.25}).addTo(pins); L.circleMarker([here.lat,here.lon],{radius:8,color:"#fff",weight:3,fillColor:"#1D4ED8",fillOpacity:1}).addTo(pins);
      map.setView([here.lat,here.lon],15); }
    else map.fitBounds(L.latLngBounds(all),{padding:[30,30],maxZoom:15});
  } else if(screen==="add"){ map.setView(map.getCenter(), Math.max(map.getZoom(),16)); }
  else { pin(S.from,"#3DDC84","Start"); pin(S.to,"#FF5A5F",S.to&&S.to.full?S.to.full:"Destination");
    if(S.fit&&S.from&&S.to){ S.fit=false; map.fitBounds(L.latLngBounds([[S.from.lat,S.from.lon],[S.to.lat,S.to.lon]]),{padding:[40,40],maxZoom:16}); } }
}

/* ================= OpenStreetMap import ================= */
const QUERY=()=>`[out:json][timeout:180];area["name"="${curCity().osm}"]["admin_level"="4"]->.a;(node["highway"="bus_stop"](area.a);node["public_transport"~"platform|stop_position"]["bus"="yes"](area.a);node["amenity"="bus_station"](area.a);way["amenity"="bus_station"](area.a);node["railway"~"station|halt"](area.a);node["place"~"^(city|town|village|suburb)$"](area.a););out center tags;`;
function ingest(json){
  let pts=[];
  if(json&&Array.isArray(json.elements)) json.elements.forEach(e=>{ const lat=e.lat??e.center?.lat, lon=e.lon??e.center?.lon; if(lat!=null){ const pl=e.tags&&e.tags.place; pts.push(pl?[(e.tags.name||e.tags["name:en"]||""),+lat,+lon,"place"]:[(e.tags&&(e.tags.name||e.tags["name:en"]))||"",+lat,+lon]); } });
  else if(json&&Array.isArray(json.features)) json.features.forEach(f=>{ const g=f.geometry; if(!g||g.type!=="Point") return; const pr=f.properties||{}; pts.push([pr.name||"",+g.coordinates[1],+g.coordinates[0]]); });
  pts=pts.filter(p=>CITIES.some(c=>c.live&&inBox({lat:p[1],lon:p[2]},c))); if(!pts.length) throw new Error("no Lagos or Delta stops found in it");
  osm=(osm||[]).filter(o=>!pts.some(p=>p[1]===o[1]&&p[2]===o[2])).concat(pts); pts=osm;
  osm=pts; const byName={}; osm.forEach(p=>{ const k=norm(p[0]); if(k&&p[3]!=="place")(byName[k]=byName[k]||[]).push(p); });
  let moved=0; snapped={}; Object.values(stops).forEach(s=>{ let best=null; [s.name,...s.aka].forEach(nm=>(byName[norm(nm)]||[]).forEach(p=>{ const d=hav(s,{lat:p[1],lon:p[2]}); if(d<2500&&(!best||d<best.d)) best={d,p}; })); if(best){ s.lat=best.p[1]; s.lon=best.p[2]; snapped[s.id]=[s.lat,s.lon]; moved++; } });
  store.set("waka.osm",osm); store.set("waka.snap",snapped); syncUserStops(); buildGraph(); drawNet(); drawMap(document.body.dataset.screen);
  const nPl=osm.filter(p=>p[3]==="place").length; return `Loaded ${(osm.length-nPl).toLocaleString()} stops and ${nPl.toLocaleString()} towns and villages. Moved ${moved} planner stops to their surveyed spots.`;
}
async function liveFetch(){ const m=$("#osmMsg"); m.textContent=`Asking OpenStreetMap for every stop in ${curCity().osm}… this can take a minute.`;
  try{ const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(QUERY()),headers:{"Content-Type":"application/x-www-form-urlencoded"}}); if(!r.ok) throw new Error("server said "+r.status); m.textContent=ingest(await r.json()); }
  catch(e){ m.textContent="Couldn't reach OpenStreetMap ("+e.message+"). Inside claude.ai outside connections are blocked; open the hosted app instead, or import a file."; } }

/* ================= start ================= */
function drawLegend(){ /* the legend now shows only the modes in the trip on screen (see drawMap) */ }
function setCityUI(){ document.body.dataset.city=settings.city; const el=$("#cityName"); if(el) el.textContent=curCity().name.replace(/ \(.*/,""); drawLegend(); }
setCityUI(); syncUserStops(); buildGraph(); initMap(); initServer();
try{ if(navigator.permissions&&navigator.geolocation) navigator.permissions.query({name:"geolocation"}).then(st=>{ if(st.state!=="granted") return;
  navigator.geolocation.getCurrentPosition(pp=>{ const p={lat:pp.coords.latitude,lon:pp.coords.longitude}; const cc=cityAt(p); if(!cc) return; if(cc.id!==settings.city){ settings.city=cc.id; saveSettings(); setCityUI(); }
    S.from={name:nearName(p,"My location"),lat:p.lat,lon:p.lon}; if(document.body.dataset.screen==="plan"){ render(); if(map) map.setView([p.lat,p.lon],14); } },()=>{},{timeout:8000}); }).catch(()=>{}); }catch(e){}
addEventListener("hashchange",render);
addEventListener("resize",()=>map&&map.invalidateSize());
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){ try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){} }
}
